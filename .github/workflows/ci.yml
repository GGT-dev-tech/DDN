name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pytest
        run: uv run pytest tests/
        env:
          ENVIRONMENT: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
