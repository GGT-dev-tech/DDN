name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: uv sync

      - name: Lint with Ruff
        working-directory: ./backend
        run: uv run ruff check .

      - name: Type checking with Mypy
        working-directory: ./backend
        run: uv run mypy .

      - name: Test with Pytest
        working-directory: ./backend
        run: uv run pytest

      - name: Alembic Bidirectional Migration Test
        working-directory: ./backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Export OpenAPI Schema
        working-directory: ./backend
        run: |
          uv run python -c "
          import json
          from fastapi.openapi.utils import get_openapi
          from main import app
          schema = get_openapi(title=app.title, version=app.version, routes=app.routes)
          with open('openapi.json', 'w') as f:
              json.dump(schema, f)
          "
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json

  frontend-checks:
    runs-on: ubuntu-latest
    needs: backend-checks
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/apps/stitch-admin/package-lock.json'
      
      - name: Download OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: frontend/apps/stitch-admin/

      - name: Install Frontend Dependencies
        working-directory: ./frontend/apps/stitch-admin
        run: npm ci

      - name: Contract Validation (Orval)
        working-directory: ./frontend/apps/stitch-admin
        run: npm run orval

      - name: TypeScript Check
        working-directory: ./frontend/apps/stitch-admin
        run: npm run tsc --noEmit

      - name: Build React App
        working-directory: ./frontend/apps/stitch-admin
        run: npm run build

      - name: Build Storybook
        working-directory: ./frontend/apps/stitch-admin
        run: npm run build-storybook
