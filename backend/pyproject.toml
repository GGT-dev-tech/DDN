[project]
name = "stitch-ddn-waste-management-interface-google-stitch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asgi-correlation-id>=4.3.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "greenlet>=3.5.3",
    "opentelemetry-api>=1.44.0",
    "passlib>=1.7.4",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "import-linter>=2.1",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=. --cov-report=xml --cov-report=term"
testpaths = ["tests", "modules"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["modules", "apps"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in function defaults is idiomatic

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.bandit]
exclude_dirs = ["tests"]
