version: "3.8"

services:
  postgres:
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stitch_test_db

  redis:
    ports:
      - "6380:6379"

  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://stitch_admin:secret_postgres@postgres:5432/stitch_test_db
      REDIS_URL: redis://redis:6379/0

