version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run uvicorn apps.api_gateway.src.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app

  worker:
    volumes:
      - ./worker:/app
      - ./backend:/app/backend

