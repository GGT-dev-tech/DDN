version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: stitch_postgres
    restart: unless-stopped
    env_file:
      - backend/.env.local
    environment:
      POSTGRES_USER: ${DATABASE_USER:-stitch_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret_postgres}
      POSTGRES_DB: ${DATABASE_NAME:-stitch_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - stitch_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-stitch_admin} -d ${DATABASE_NAME:-stitch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stitch_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - stitch_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stitch_api
    restart: unless-stopped
    env_file:
      - backend/.env.local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stitch_network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: stitch_worker
    restart: unless-stopped
    env_file:
      - worker/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stitch_network

volumes:
  postgres_data:
  redis_data:

networks:
  stitch_network:
    driver: bridge
